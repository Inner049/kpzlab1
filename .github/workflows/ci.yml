name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Тестування та перевірка якості коду
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint with flake8
        run: |
          # Зупинити build якщо є синтаксичні помилки або невизначені імена
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Перевірити стиль коду (попередження, не зупиняє build)
          flake8 src/ --count --max-line-length=100 --statistics || true

      - name: Run tests with pytest
        run: |
          # Запуск тестів з coverage
          pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=html
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  # Job 2: Збірка Docker образу
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t expense-tracker:test .
          docker images expense-tracker:test

      - name: Test Docker image
        run: |
          # Запустити контейнер
          docker run -d --name test-container \
            -p 8000:8000 \
            -e DB_URL=sqlite:///app.db \
            expense-tracker:test
          
          # Почекати поки застосунок запуститься
          sleep 10
          
          # Перевірити health endpoint
          curl -f http://localhost:8000/health || exit 1
          
          # Зупинити контейнер
          docker stop test-container
          docker rm test-container

  # Job 3: Публікація образу (тільки для тегів)
  publish:
    name: Publish to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/')
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
