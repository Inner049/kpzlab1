version: '3.8'

services:
  # FastAPI застосунок
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: expense-tracker-app
    ports:
      - "8000:8000"
    environment:
      - DB_URL=postgresql://expense_user:expense_pass@postgres:5432/expense_db
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - expense-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # PostgreSQL база даних
  postgres:
    image: postgres:16-alpine
    container_name: expense-tracker-db
    environment:
      - POSTGRES_USER=expense_user
      - POSTGRES_PASSWORD=expense_pass
      - POSTGRES_DB=expense_db
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - expense-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense_user -d expense_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer - Web UI для управління БД
  adminer:
    image: adminer:latest
    container_name: expense-tracker-adminer
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - expense-network
    restart: unless-stopped

networks:
  expense-network:
    driver: bridge
    name: expense-network

volumes:
  postgres-data:
    name: expense-tracker-postgres-data
